import info.metadude.kotlin.library.engelsystem.GradlePlugins

apply from: "gradle/gradle-versions.gradle"

buildscript {

    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath GradlePlugins.dokka
        classpath GradlePlugins.kotlin
        classpath GradlePlugins.ksp
        classpath GradlePlugins.publish
        classpath GradlePlugins.versions
    }
}

allprojects {
    repositories {
        mavenCentral()
    }
}

subprojects {
    group = GROUP
    version = VERSION_NAME

    plugins.withId("org.jetbrains.dokka-javadoc") {
        project.extensions.configure("dokka") { dokka ->
            dokka.dokkaSourceSets.named("main") {
                sourceLink {
                    localDirectory.set(project.layout.projectDirectory.dir("src/main/kotlin"))
                    remoteUrl.set(URI.create("https://github.com/johnjohndoe/engelsystem/blob/master/${project.name}/src/main/kotlin"))
                    remoteLineSuffix.set("#L")
                }
            }
        }
    }
}
